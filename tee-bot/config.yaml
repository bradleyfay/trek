# ─── Blue Hill CC tee time bot ────────────────────────────────────────────────

club:
  teetime_url: "https://www.bluehillcc.com/group/pages/teetime"
  # course: 1  # 1=Championship, 2=Challenger, 3=Sim 1, 4=Sim 2


# ─── Members ─────────────────────────────────────────────────────────────────
# Each member needs a matching pair of env vars:
#   <ENV_PREFIX>_USERNAME and <ENV_PREFIX>_PASSWORD
#
# Add a member by copying one of the blocks below.
# Per-member time overrides are optional — omit to use the defaults below.

members:
  - name: "Brad"
    env_prefix: "BRAD"
    # earliest_time: "08:00"   # override default window for this member
    # latest_time: "10:30"

  # - name: "Jane"
  #   env_prefix: "JANE"
  #   earliest_time: "07:30"
  #   latest_time: "09:00"


# ─── Default preferences (apply to all members unless overridden above) ───────

preferences:
  days_in_advance: 7
  earliest_time: "08:00"
  latest_time: "10:30"
  players: 4


# ─── Schedule ────────────────────────────────────────────────────────────────

schedule:
  run_time: "07:00"
  timezone: "America/New_York"
  # 0=Mon … 6=Sun; [5, 6] fires Sat+Sun to book 7 days out
  run_on_days: [5, 6]
