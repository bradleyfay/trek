# ─── Blue Hill CC tee time bot ────────────────────────────────────────────────
# Portal: Northstar Technologies on Liferay (JSF/PrimeFaces)
# ──────────────────────────────────────────────────────────────────────────────

club:
  # Tee time booking page (change only if the URL ever moves)
  teetime_url: "https://www.bluehillcc.com/group/pages/teetime"

  # Course preference (uncomment/change if needed):
  # 1 = Championship Course (default)
  # 2 = Challenger Course
  # 3 = Simulator 1
  # 4 = Simulator 2
  course: 1


preferences:
  # How many days ahead the booking window opens at Blue Hill
  days_in_advance: 7

  # Only book slots that start within this window (24-hour format)
  earliest_time: "08:00"
  latest_time: "10:30"

  # Number of players — used when the reservation dialog has a players dropdown
  players: 4


schedule:
  # What time the booking window opens (bot fires at this time)
  run_time: "07:00"

  # Your local timezone — full list at:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "America/New_York"

  # Days of the week to run (0 = Monday … 6 = Sunday).
  # [5, 6] fires on Saturday + Sunday to book 7 days out (next Sat/Sun).
  run_on_days: [5, 6]
